name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: civil_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/civil_erp_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-super-secret-jwt-key-minimum-32-chars-long!
          NODE_ENV: test

      - name: Build
        run: pnpm build

  docker:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build --target api -t wcm-api:ci .
      - name: Build web image
        run: docker build --target web -t wcm-web:ci .
      - name: Check the compose file
        run: cp deploy/.env.example deploy/.env && sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=x/; s/^JWT_SECRET=.*/JWT_SECRET=x/; s/^JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=y/' deploy/.env && docker compose -f deploy/docker-compose.yml config -q

  vercel:
    name: Vercel build (app + MongoDB API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Install (as Vercel does)
        run: pnpm install --frozen-lockfile --filter @civil/web...
      - name: Typecheck the server
        run: cd apps/web && npx tsc --noEmit -p server/tsconfig.json
      - name: Build .vercel/output
        run: cd apps/web && node scripts/vercel-build.mjs
