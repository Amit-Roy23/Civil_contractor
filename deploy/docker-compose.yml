# WCM production stack:  cd deploy && docker compose up -d --build
#   caddy     HTTPS on your domain (ports 80 and 443), serves the app, forwards /api to the API
#   api       NestJS API with the business rules
#   postgres  the database (not reachable from the internet)
#   redis     job queue for alerts (not reachable from the internet)
#   backup    nightly pg_dump of the database into deploy/backups
name: wcm

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wcm
      POSTGRES_USER: wcm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wcm -d wcm']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    image: wcm-api:latest
    init: true
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      BUSINESS_TZ: Asia/Kolkata
      DATABASE_URL: postgresql://wcm:${POSTGRES_PASSWORD}@postgres:5432/wcm
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in deploy/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${DOMAIN}}
      DEFAULT_COMPANY: ${DEFAULT_COMPANY:-}
      DEMO_COMPANY: ${DEMO_COMPANY:-off}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      BACKUP_DAILY: ${BACKUP_DAILY:-on}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_S3: ${BACKUP_S3:-off}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      API_DOCS: ${API_DOCS:-off}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.ap-south-1.amazonaws.com}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_BUCKET: ${S3_BUCKET:-wcm}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-none}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-none}
    logging: *logging

  caddy:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    image: wcm-web:latest
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddydata:/data
      - caddyconfig:/config
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: wcm
      PGDATABASE: wcm
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${DB_BACKUP_KEEP_DAYS:-14}
      BACKUP_AT: ${DB_BACKUP_AT:-02:30}
      TZ: Asia/Kolkata
    volumes:
      - ./backups:/backups
      - ./db-backup.sh:/db-backup.sh:ro
    entrypoint: ['/bin/sh', '/db-backup.sh']
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
